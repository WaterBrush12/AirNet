<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Air Quality Dashboard</title>
    <style>
        body { font-family: sans-serif; }
        .online { color: green; font-weight: bold; }
        .offline { color: red; }
        .device-container {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>ESP32 Air Quality Dashboard</h1>
    <div id="dashboard-container">
        </div>

    <script>
        // Combine all data into a single object for easier access
        let allData = {};

        function updateAllData() {
            // Fetch device status
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    data.devices.forEach(device => {
                        if (!allData[device.uniqueid]) {
                            allData[device.uniqueid] = {};
                        }
                        allData[device.uniqueid].status = device.status;
                    });
                })
                .catch(error => {
                    console.error('Error fetching device status:', error);
                });

            // Fetch air quality data
            fetch('/air_data')
                .then(response => response.json())
                .then(data => {
                    for (const uniqueid in data) {
                        if (!allData[uniqueid]) {
                            allData[uniqueid] = {};
                        }
                        allData[uniqueid].air_quality = data[uniqueid];
                    }
                    renderDashboard();
                })
                .catch(error => {
                    console.error('Error fetching air data:', error);
                });
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = ''; // Clear previous content

            for (const uniqueid in allData) {
                const device = allData[uniqueid];
                const deviceCard = document.createElement('div');
                deviceCard.className = 'device-container';

                const header = document.createElement('div');
                header.className = 'device-header';
                
                const deviceId = document.createElement('h2');
                deviceId.textContent = `Device ID: ${uniqueid}`;
                
                const statusSpan = document.createElement('span');
                if (device.status) {
                    statusSpan.textContent = device.status.charAt(0).toUpperCase() + device.status.slice(1);
                    statusSpan.className = device.status;
                }
                
                header.appendChild(deviceId);
                header.appendChild(statusSpan);
                deviceCard.appendChild(header);

                if (device.air_quality) {
                    const airData = device.air_quality;
                    const pm25 = document.createElement('p');
                    pm25.textContent = `PM2.5: ${airData.pm2_5}`;
                    deviceCard.appendChild(pm25);

                    const pm10 = document.createElement('p');
                    pm10.textContent = `PM10: ${airData.pm10}`;
                    deviceCard.appendChild(pm10);

                    const voc = document.createElement('p');
                    voc.textContent = `VOC: ${airData.volatile_organic_compounds}`;
                    deviceCard.appendChild(voc);

                    const gases = document.createElement('p');
                    gases.textContent = `Gases (CO, NO2, O3): ${airData.co}, ${airData.no2}, ${airData.o3}`;
                    deviceCard.appendChild(gases);
                    
                    const timestamp = document.createElement('p');
                    const lastUpdated = new Date(airData.timestamp).toLocaleString();
                    timestamp.textContent = `Last Reading: ${lastUpdated}`;
                    deviceCard.appendChild(timestamp);
                } else {
                    const noData = document.createElement('p');
                    noData.textContent = "No recent air quality data.";
                    deviceCard.appendChild(noData);
                }

                container.appendChild(deviceCard);
            }
        }

        // Update every 5 seconds
        setInterval(updateAllData, 5000);
        
        // Initial update
        updateAllData();
    </script>
</body>
</html>
